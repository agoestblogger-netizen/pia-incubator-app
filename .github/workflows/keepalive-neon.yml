name: keepalive-neon

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel health endpoint
        run: |
          curl -fsS -o /dev/null -w "health status: %{http_code}\n" \
            --max-time 60 \
            https://pia-incubator-app.vercel.app/api/health
      - name: Ping Coolify production
        run: |
          curl -fsS -o /dev/null -w "coolify status: %{http_code}\n" \
            --max-time 60 \
            https://inkubasi.aicee.web.id/api/health